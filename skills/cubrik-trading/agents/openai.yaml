interface:
  display_name: "Trading"
  short_description: "Orders, stops and closing positions on your connected platforms"
  default_prompt: "Show my open positions and set a stop on my BTC long"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "cubrik"
      description: "cubrik MCP server — AI trading agents, backtests, portfolio and brokers"
      transport: "streamable_http"
      url: "https://mcp.cubrik.ai/mcp"
